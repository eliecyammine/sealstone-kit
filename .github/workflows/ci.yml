name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Linux, so it bills at the base rate. None of these needs a compiler: they
  # read the manifest and the source tree, and they are the checks most likely
  # to catch a mistake, so they should be the cheapest ones to run.
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Assert no package dependencies
        run: |
          if grep -qE '^\s*\.package\(' Package.swift; then
            echo "Package.swift declares a dependency. This package uses the"
            echo "platform and one vendored Argon2id, and nothing else."
            exit 1
          fi
          echo "No package dependencies."

      - name: Assert the core has no UI framework imports
        run: |
          hits=$(grep -rlE '^\s*(public |private |internal )?import (SwiftUI|UIKit|AppKit|WebKit|StoreKit|Combine)' \
            Sources/VaultCore Sources/VaultCrypto Sources/OTP 2>/dev/null || true)
          if [ -n "$hits" ]; then
            echo "A core module imports a UI framework:"
            echo "$hits"
            exit 1
          fi
          echo "Core modules are free of UI frameworks."

      # Git does not track empty directories, so a target whose sources were
      # never committed builds locally and fails on the runner. Catch it as a
      # clear message rather than an SPM path error.
      - name: Assert every declared target has sources
        run: |
          missing=""
          for dir in Sources/* Tests/*; do
            [ -d "$dir" ] || continue
            if [ -z "$(find "$dir" -name '*.swift' -print -quit)" ]; then
              missing="$missing $dir"
            fi
          done
          if [ -n "$missing" ]; then
            echo "These targets have no Swift sources:$missing"
            echo "Either add sources or remove the target from Package.swift."
            exit 1
          fi
          echo "Every target has sources."

      - name: Assert the vector corpus is present
        run: |
          if [ ! -f Tests/ConformanceTests/Vectors/manifest.json ]; then
            echo "The vector corpus is missing. Run Scripts/sync-vectors.sh."
            exit 1
          fi
          echo "Corpus present: $(find Tests/ConformanceTests/Vectors -type f | wc -l | tr -d ' ') files."

  # macOS, because the crypto is built on CryptoKit and there is no other
  # platform that has it. This job is kept to the compiler work alone.
  test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # Pinned so a runner image update cannot silently change the toolchain,
      # and pinned to the version development happens on. A gap between the two
      # hides portability problems until CI finds them one at a time.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Report toolchain
        run: swift --version

      # No separate build step. `swift test` builds the library and the test
      # targets, so building first only compiled the library twice.
      - name: Test
        run: swift test

      # Production Argon2 parameters. Slow, and therefore the thing most likely
      # to go untested if it is not asked for explicitly.
      - name: Test at production parameters
        env:
          SEALSTONE_SLOW_TESTS: "1"
        run: swift test --filter ConformanceTests
